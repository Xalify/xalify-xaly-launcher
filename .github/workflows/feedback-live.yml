name: Feedback live check
on:
  push:
    branches: [feedback-youform]
jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cd tests && npm init -y >/dev/null && npm i --no-save playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
      - run: |
          node tests/run.js >/dev/null || true
          cp tests/feedback-live.js tests/.work/ && cd tests/.work && node feedback-live.js
