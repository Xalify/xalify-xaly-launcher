name: Release

# Builds "Xaly Launcher.exe" on Windows and publishes it as a GitHub release.
# Every push to main is released: a new version number in index.html is used as-is,
# otherwise the patch number goes up by itself. Can also be started from the Actions tab or with a v* tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['tools/build-catalog.js', '.github/workflows/catalog.yml']   # store-list builder changes don't need a new launcher

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Nothing is released unless every automatic test passes.
      - name: Run tests
        shell: pwsh
        run: |
          git fetch -q --depth 1 origin catalog 2>$null
          node tests/run.js
          if ($LASTEXITCODE -ne 0) { throw "Tests failed, so this version was not released." }

      # Works out which version to publish. If main changed but the version in index.html was
      # already released, the next patch version is created automatically (1.5.0 -> 1.5.1), with
      # patch notes taken from the commit messages since the last release.
      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding $false
          $html = [IO.File]::ReadAllText("$PWD/index.html")
          $v = [regex]::Match($html, 'var VER="([^"]+)"').Groups[1].Value
          if (-not $v) { throw "Couldn't find var VER in index.html" }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".TrimStart('v') -ne $v) { throw "index.html says $v but the tag is ${{ github.ref_name }}" }
          gh release view "v$v" -R "${{ github.repository }}" *> $null
          $released = ($LASTEXITCODE -eq 0); $global:LASTEXITCODE = 0
          $sha = "${{ github.sha }}"
          if ($released) {
            if ("${{ github.event_name }}" -ne "push" -or "${{ github.ref }}" -ne "refs/heads/main") { Write-Host "v$v is already released"; "skip=true" >> $env:GITHUB_OUTPUT; exit 0 }
            $subjects = @(git log "v$v..HEAD" --no-merges --pretty=format:%s | Where-Object { $_ -and $_ -notmatch '^Release \d' })
            if ($subjects.Count -eq 0) { Write-Host "Nothing new since v$v"; "skip=true" >> $env:GITHUB_OUTPUT; exit 0 }
            $p = $v.Split('.'); $nv = "{0}.{1}.{2}" -f $p[0], $p[1], ([int]$p[2] + 1)
            $notes = @($subjects | Select-Object -First 10)
            $js = ($notes | ForEach-Object { '"' + ($_.Replace('\', '\\').Replace('"', '\"')) + '"' }) -join ','
            $date = (Get-Date).ToString("d MMM yyyy", [Globalization.CultureInfo]::InvariantCulture)
            $html = $html.Replace("var VER=`"$v`";", "var VER=`"$nv`";")
            $entry = " {v:`"$nv`",d:`"$date`",t:[$js]},"
            $m = [regex]::Match($html, 'var NOTES=\[\r?\n')
            if (-not $m.Success) { throw "Couldn't find var NOTES in index.html" }
            $nl = if ($m.Value.EndsWith("`r`n")) { "`r`n" } else { "`n" }
            $html = $html.Substring(0, $m.Index + $m.Length) + $entry + $nl + $html.Substring($m.Index + $m.Length)
            [IO.File]::WriteAllText("$PWD/index.html", $html, $utf8)
            git config user.name "xaly-release"
            git config user.email "xaly-release@users.noreply.github.com"
            git commit -am "Release $nv" -q
            git push origin HEAD:main
            if ($LASTEXITCODE -ne 0) { throw "Couldn't push the version bump" }
            $sha = (git rev-parse HEAD).Trim()
            $v = $nv
            Write-Host "Bumped to $v"
          }
          "v=$v" >> $env:GITHUB_OUTPUT
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "skip=false" >> $env:GITHUB_OUTPUT

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          ./tools/get-webview2.ps1
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:"Xaly Launcher.exe" /win32icon:xaly.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /r:System.Security.dll /define:WEBVIEW2 /r:webview2\Microsoft.Web.WebView2.Core.dll /r:webview2\Microsoft.Web.WebView2.WinForms.dll Xaly.cs
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }

      - name: Package
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          ITCH_KEY: ${{ secrets.ITCH_KEY }}
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          New-Item -ItemType Directory -Force XalyLauncher | Out-Null
          Copy-Item "Xaly Launcher.exe","index.html","xaly.ico","webview2/Microsoft.Web.WebView2.Core.dll","webview2/Microsoft.Web.WebView2.WinForms.dll" XalyLauncher/
          foreach ($a in "x64","x86","arm64") { if (Test-Path "webview2/$a") { Copy-Item "webview2/$a" "XalyLauncher/$a" -Recurse } }
          Copy-Item "sounds" "XalyLauncher/sounds" -Recurse
          if ($env:ITCH_KEY) { [IO.File]::WriteAllText("$PWD/XalyLauncher/itchkey.txt", $env:ITCH_KEY.Trim()) } else { Write-Host "Using the itch.io key built into Xaly.cs" }
          Compress-Archive -Path XalyLauncher -DestinationPath "XalyLauncher-$v.zip"
          $h = (Get-FileHash "XalyLauncher-$v.zip" -Algorithm SHA256).Hash.ToLower()
          # same file under a fixed name, so a website can always link to .../releases/latest/download/XalyLauncher.zip
          Copy-Item "XalyLauncher-$v.zip" "XalyLauncher.zip"
          # the release page (which the launcher's update window shows) uses this version's patch notes from index.html
          $html = [IO.File]::ReadAllText("$PWD/index.html")
          $m = [regex]::Match($html, '\{v:"' + [regex]::Escape($v) + '",d:"[^"]*",t:\[(.*)\]\}')
          if (-not $m.Success) { throw "index.html has no patch notes for $v" }
          $items = [regex]::Matches($m.Groups[1].Value, '"((?:[^"\\]|\\.)*)"') | ForEach-Object { "- " + [regex]::Unescape($_.Groups[1].Value) }
          $notes = $items -join "`n"
          [IO.File]::WriteAllText("$PWD/notes.md", $notes.Trim() + "`n`nSHA256: $h`n")

      - name: Publish
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          gh release create "v$v" "XalyLauncher-$v.zip" "XalyLauncher.zip" --title "Xaly Launcher $v" --notes-file notes.md --target "${{ steps.ver.outputs.sha }}"
