name: Release

# Builds "Xaly Launcher.exe" on Windows and publishes it as a GitHub release.
# Runs by itself whenever main gets a version number (var VER="x.y.z" in index.html)
# that hasn't been released yet. Can also be started from the Actions tab or with a v* tag.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path index.html -Pattern 'var VER="([^"]+)"'
          $v = $m.Matches[0].Groups[1].Value
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}".TrimStart('v') -ne $v) { throw "index.html says $v but the tag is ${{ github.ref_name }}" }
          "v=$v" >> $env:GITHUB_OUTPUT
          $env:GH_TOKEN = "${{ github.token }}"
          gh release view "v$v" -R "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "v$v is already released, nothing to do"; "skip=true" >> $env:GITHUB_OUTPUT } else { "skip=false" >> $env:GITHUB_OUTPUT }
          exit 0

      - name: Build
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          ./tools/get-webview2.ps1
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /optimize+ /out:"Xaly Launcher.exe" /win32icon:xaly.ico /r:System.Windows.Forms.dll /r:System.Drawing.dll /r:System.Core.dll /r:System.IO.Compression.dll /r:System.IO.Compression.FileSystem.dll /define:WEBVIEW2 /r:webview2\Microsoft.Web.WebView2.Core.dll /r:webview2\Microsoft.Web.WebView2.WinForms.dll Xaly.cs
          if ($LASTEXITCODE -ne 0) { throw "compile failed" }

      - name: Package
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          ITCH_KEY: ${{ secrets.ITCH_KEY }}
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          New-Item -ItemType Directory -Force XalyLauncher | Out-Null
          Copy-Item "Xaly Launcher.exe","index.html","xaly.ico","webview2/Microsoft.Web.WebView2.Core.dll","webview2/Microsoft.Web.WebView2.WinForms.dll" XalyLauncher/
          foreach ($a in "x64","x86","arm64") { if (Test-Path "webview2/$a") { Copy-Item "webview2/$a" "XalyLauncher/$a" -Recurse } }
          if ($env:ITCH_KEY) { [IO.File]::WriteAllText("$PWD/XalyLauncher/itchkey.txt", $env:ITCH_KEY.Trim()) } else { Write-Host "Using the itch.io key built into Xaly.cs" }
          Compress-Archive -Path XalyLauncher -DestinationPath "XalyLauncher-$v.zip"
          $h = (Get-FileHash "XalyLauncher-$v.zip" -Algorithm SHA256).Hash.ToLower()
          $notes = if (Test-Path release-notes.md) { Get-Content release-notes.md -Raw } else { "Xaly Launcher $v" }
          [IO.File]::WriteAllText("$PWD/notes.md", $notes.Trim() + "`n`nSHA256: $h`n")

      - name: Publish
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "${{ steps.ver.outputs.v }}"
          gh release create "v$v" "XalyLauncher-$v.zip" --title "Xaly Launcher $v" --notes-file notes.md --target "${{ github.sha }}"
