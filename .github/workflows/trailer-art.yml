name: Trailer art
on: push
permissions: {contents: write}
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 fetch.py
      - name: Encrypt for the trailer workspace and push
        run: |
          tar czf art.tgz out
          openssl rand -hex 32 > k.txt
          openssl enc -aes-256-cbc -pbkdf2 -salt -in art.tgz -out art.bin -pass file:k.txt
          openssl pkeyutl -encrypt -pubin -inkey pub.pem -in k.txt -out k.bin
          split -b 45m art.bin art.part. && rm -rf out art.tgz k.txt art.bin
          git config user.name "github-actions" && git config user.email "actions@github.com"
          git add art.part.* k.bin && git commit -qm "encrypted art" && git push origin HEAD:trailer-art
