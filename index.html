<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta http-equiv="X-UA-Compatible" content="IE=edge"><title>Xaly Launcher</title>
<style>
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:#0b0b10;color:#f3f3f7;font:14px "Segoe UI Variable Text","Segoe UI",Arial,sans-serif;-ms-user-select:none;user-select:none}
input,textarea,select{-ms-user-select:text;user-select:text;font:14px "Segoe UI",Arial,sans-serif;color:#f3f3f7;background:#1b1b26;border:1px solid #2b2b3a;border-radius:9px;padding:10px 12px;outline:0;width:100%}
input:focus,textarea:focus,select:focus{border-color:#5d5d78}
textarea{resize:none}select option{background:#1b1b26}
button{border:0;font-family:inherit;color:inherit;cursor:pointer;outline:0}
::-ms-input-placeholder{color:#777790}
#app{position:absolute;left:0;top:0;right:0;bottom:0}
/* splash */
#splash{position:absolute;left:0;top:0;right:0;bottom:0;background:#0b0b10;z-index:50;text-align:center;opacity:1;visibility:visible}
#splash.out{opacity:0;visibility:hidden;transition:opacity .5s,visibility 0s .5s}
#splash .lg{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-92px 0 0 -52px;animation:lg .9s cubic-bezier(.2,.9,.3,1.2) both}
#splash .lg img{width:104px;height:104px;display:block}
#splash .ring{position:absolute;left:50%;top:50%;width:104px;height:104px;margin:-92px 0 0 -52px;border-radius:26px;border:2px solid #8a6cff;animation:ring 1.4s ease-out .5s infinite}
#splash .nm{position:absolute;left:0;right:0;top:50%;margin-top:42px;font-size:15px;font-weight:600;letter-spacing:9px;color:#b9b9cc;animation:fade .8s .5s both}
@keyframes lg{0%{opacity:0;transform:scale(.4) rotate(-14deg)}100%{opacity:1;transform:none}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.9);opacity:0}}
@keyframes fade{from{opacity:0;letter-spacing:2px}to{opacity:1;letter-spacing:9px}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
#app.pop #main{animation:pop .45s both}#app.pop #top{animation:up .45s both}
.page.in{animation:up .35s both}
/* top bar */
#top{position:absolute;left:0;top:0;right:0;height:62px;display:flex;align-items:center;padding:0 20px 0 22px}
#brand{display:flex;align-items:center;margin-right:26px}#brand img{width:32px;height:32px;margin-right:10px}
#brand b{font-size:17px;letter-spacing:.4px}
.tab{background:transparent;color:#a3a3b8;height:36px;padding:0 18px;border-radius:18px;font-size:15px;font-weight:600;margin-right:4px}
.tab:hover{background:#181822;color:#fff}.tab.on{background:#23233a;color:#fff}
#back{background:transparent;color:#a3a3b8;font-size:26px;width:36px;height:36px;border-radius:18px;margin-right:6px;line-height:28px;display:none}
#back:hover{background:#181822;color:#fff}
#tsp{flex:1 1 0%}
#fbtn{position:relative;background:#181822;height:38px;padding:0 16px;border-radius:19px;font-weight:600;margin-right:12px}
#fbtn:hover,#fbtn.on{background:#23233a}
#badge{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:#2ecc71;color:#06210f;font-size:12px;font-weight:700;text-align:center;margin-left:8px;padding:0 5px}
#chip{display:flex;align-items:center;background:#181822;height:42px;padding:0 14px 0 5px;border-radius:21px;cursor:pointer}
#chip:hover{background:#23233a}#chip span{margin-left:9px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* shell */
#main{position:absolute;left:12px;right:12px;top:62px;bottom:62px;background:#12121a;border:1px solid #22222f;border-radius:16px;overflow:hidden}
.page{position:absolute;left:0;top:0;right:0;bottom:0;overflow-y:auto;padding:28px 38px 44px;display:none;-ms-overflow-style:-ms-autohiding-scrollbar}
.head{display:flex;align-items:center;margin-bottom:24px}.head .sp{flex:1 1 0%}
.pill{width:300px;border-radius:22px;padding:11px 18px}
.btn{background:#22222f;border-radius:9px;padding:10px 18px;font-weight:600;font-size:13px}
.btn:hover{background:#2e2e40}.btn[disabled]{opacity:.5;cursor:default}.btn.dng{background:#4a2227}.btn.dng:hover{background:#63292f}
.pri{border-radius:9px;padding:11px 24px;font-weight:700;font-size:14px;color:#fff}
.pri[disabled]{opacity:.5;cursor:default}.pri.big{padding:15px 54px;font-size:16px;border-radius:11px}.pri.stop{background:#d9534f !important}
.msg{color:#9a9ab0;text-align:center;margin:50px 0;line-height:1.7;font-size:15px}
.sec{font-size:19px;font-weight:700;margin:6px 0 16px}
.row button{margin-right:8px}
/* carousel */
.car{position:relative;height:410px;border-radius:14px;overflow:hidden;background:#1a1a26;margin-bottom:32px}
.slide{position:absolute;left:0;top:0;right:0;bottom:0;opacity:0;visibility:hidden;transition:opacity .7s;background-size:cover;background-position:center;cursor:pointer}
.slide.on{opacity:1;visibility:visible}
.slide .shade{position:absolute;left:0;right:0;top:0;bottom:0;background:linear-gradient(to top,rgba(0,0,0,.9),rgba(0,0,0,0) 64%)}
.slide .hi{position:absolute;left:38px;right:130px;bottom:36px}
.slide h2{margin:0 0 8px;font-size:38px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.slide .pr{color:#dcdce6;max-width:620px;line-height:1.5;margin-bottom:16px}
.tag{display:inline-block;background:rgba(255,255,255,.16);border-radius:6px;padding:3px 9px;font-size:12px;font-weight:600;margin-bottom:10px}
.arr{position:absolute;top:50%;margin-top:-26px;width:44px;height:52px;border-radius:11px;background:rgba(0,0,0,.45);color:#fff;font-size:30px;line-height:40px;padding:0}
.arr:hover{background:rgba(0,0,0,.72)}.arr.l{left:14px}.arr.r{right:14px}
.dots{position:absolute;right:26px;bottom:34px}
.d2{display:inline-block;width:9px;height:9px;border-radius:5px;background:rgba(255,255,255,.35);margin-left:7px;cursor:pointer;transition:width .25s}
.d2.on{background:#fff;width:24px}
/* cards + tiles */
.card{display:inline-block;vertical-align:top;width:236px;margin:0 18px 22px 0;background:#1a1a26;border-radius:12px;overflow:hidden;cursor:pointer;transition:transform .18s}
.card:hover{transform:translateY(-4px)}
.card .th{height:112px;background-size:cover;background-position:center}
.card .ci{padding:12px 14px 14px}.card .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .pr{color:#9a9ab0;font-size:12.5px;margin:3px 0 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile{display:inline-block;vertical-align:top;width:180px;margin:0 18px 24px 0;cursor:pointer}
.art{position:relative;width:180px;height:240px;border-radius:12px;overflow:hidden;background-size:cover;background-position:center;transition:transform .18s,box-shadow .18s}
.tile:hover .art{transform:translateY(-4px);box-shadow:0 10px 26px rgba(0,0,0,.5)}
.art .ic{position:absolute;left:58px;top:70px;width:64px;height:64px}
.dot{position:absolute;right:10px;top:10px;width:12px;height:12px;border-radius:6px;background:#2ecc71;box-shadow:0 0 0 3px rgba(0,0,0,.4)}
.star{position:absolute;left:10px;top:6px;color:#ffd75e;font-size:18px}
.tile .nm{margin-top:10px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.tile .sb{color:#9a9ab0;font-size:12px;margin-top:2px}
.addt .art{background:#181824;border:2px dashed #34344a;box-shadow:none}.addt .art b{position:absolute;left:0;right:0;top:78px;text-align:center;font-size:54px;color:#666680;font-weight:300}
/* detail / game */
.banner{height:330px;border-radius:14px;position:relative;overflow:hidden;background-size:cover;background-position:center}
.banner .fade{position:absolute;left:0;right:0;bottom:0;height:170px;background:linear-gradient(to top,rgba(0,0,0,.7),rgba(0,0,0,0))}
.banner .bt{position:absolute;left:34px;right:34px;bottom:26px;font-size:40px;font-weight:700;text-shadow:0 2px 12px rgba(0,0,0,.55)}
.bar{display:flex;align-items:center;margin:24px 0 16px}.st{margin-right:34px}.st small{display:block;color:#9a9ab0;font-size:12px}.st b{font-size:15px}
.dsc{max-width:740px;line-height:1.65;color:#cfcfdb;margin:6px 0 20px;font-size:15px}
.note{background:#2c2515;border-left:4px solid #e0a82e;border-radius:7px;padding:12px 16px;margin:0 0 16px;max-width:740px;line-height:1.55}
.paste{display:flex;max-width:740px;margin:0 0 18px}.paste input{flex:1 1 0%;margin-right:8px}
.path{color:#9a9ab0;word-break:break-all;margin-bottom:16px}
/* avatars */
.av{position:relative;border-radius:50%;text-align:center;color:#1a1a26;font-weight:700;flex:0 0 auto}
.pd{position:absolute;right:-1px;bottom:-1px;width:13px;height:13px;border-radius:50%;border:3px solid #12121a;background:#6b6b80}
.pd.online{background:#2ecc71}.pd.away{background:#f5b942}.pd.busy{background:#ef5350}
/* friends panel */
#fp{position:absolute;right:0;top:0;bottom:0;width:350px;background:#0f0f16;border-left:1px solid #22222f;transform:translateX(102%);transition:transform .32s cubic-bezier(.2,.8,.2,1);z-index:20;display:flex;flex-direction:column}
#fp.open{transform:none}
#fph{padding:20px 20px 14px;border-bottom:1px solid #1d1d2a}
#fph h3{margin:0 0 14px;font-size:20px}
.me{display:flex;align-items:center}.me .mn{flex:1 1 0%;margin-left:12px;min-width:0}.me .mn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me select{width:auto;padding:3px 6px;font-size:12px;margin-top:3px;background:#181824;border-color:#181824;color:#a3a3b8}
#fpa{display:flex;padding:14px 20px 4px}#fpa input{flex:1 1 0%;margin-right:8px;padding:9px 14px;border-radius:20px}
#fpb{flex:1 1 0%;min-height:0;overflow-y:auto;padding:6px 12px 20px;-ms-overflow-style:-ms-autohiding-scrollbar}
.gh{color:#8d8da6;font-size:12px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;margin:16px 8px 6px}
.fr{display:flex;align-items:center;padding:8px;border-radius:10px;cursor:pointer}.fr:hover{background:#1a1a27}
.fr .fn{margin-left:12px;min-width:0;flex:1 1 0%}.fr .fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .fn span{display:block;color:#9a9ab0;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fr .btn{padding:6px 12px}.fnote{color:#8d8da6;font-size:12.5px;line-height:1.55;padding:8px}
.fnote.ferr{color:#e6a04a}
#badge.al{background:#e5484d !important}
.me .mcode{display:block;color:#7c7c94;font-size:11.5px;margin-top:3px;letter-spacing:.5px}
.sm{padding:6px 12px !important;font-size:13px !important;border-radius:8px !important}
.fr .pri.sm{margin-right:6px}
.fr .fn span.pl{color:#6fe38a}
.unr{background:#e5484d;color:#fff;border-radius:10px;font-size:11.5px;font-weight:700;padding:2px 7px;margin-left:8px}
.fempty{text-align:center;padding:30px 14px;color:#9a9ab0;font-size:13px;line-height:1.55}
.fempty b{display:block;color:#fff;font-size:16px;margin-bottom:6px}
.fcode{display:flex;align-items:center;justify-content:center;margin-top:14px}
.fcode span{font-size:20px;font-weight:800;letter-spacing:2px;color:#fff;margin-right:12px}
#fpb.chat{padding:0;overflow:hidden;display:flex;flex-direction:column}
.chh{display:flex;align-items:center;padding:10px 12px;border-bottom:1px solid #1d1d2a;flex:0 0 auto}
.chh .fn{margin-left:10px;min-width:0;flex:1 1 0%}.chh .fn b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chh .fn span{display:block;color:#9a9ab0;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chh .fn span.pl{color:#6fe38a}
.chb{background:transparent;color:#cfcfe0;font-size:22px;width:34px;height:34px;padding:0;border-radius:8px;line-height:30px;flex:0 0 auto}.chb:hover{background:#1f1f2e}
.chl{flex:1 1 0%;min-height:0;overflow-y:auto;padding:10px 14px;-ms-overflow-style:-ms-autohiding-scrollbar}
.chempty{text-align:center;color:#9a9ab0;font-size:13px;padding:40px 10px}.chempty b{display:block;color:#fff;font-size:16px;margin:10px 0 4px}
.chempty>div:first-child{margin:0 auto}
.chd{text-align:center;color:#6f6f88;font-size:11.5px;font-weight:700;margin:12px 0 8px}
.cm{margin:4px 0;text-align:left}.cm.me{text-align:right}
.cbub{display:inline-block;max-width:84%;background:#20202e;border-radius:14px 14px 14px 4px;padding:8px 12px;text-align:left;font-size:13.5px;line-height:1.45;word-wrap:break-word}
.cm.me .cbub{background:#2563c9;border-radius:14px 14px 4px 14px}
.ct{color:#6f6f88;font-size:10.5px;margin:2px 4px 0}
.cg{min-width:200px}.cg small{display:block;color:#b8b8cc;font-size:11px;margin-bottom:2px}.cg b{display:block;margin-bottom:8px}
.cgi{height:96px;border-radius:9px;background-size:cover;background-position:center;margin-bottom:8px}
.ctx{margin-top:0}.cg+.ctx{margin-top:6px}
.chi{display:flex;padding:10px 12px;border-top:1px solid #1d1d2a;flex:0 0 auto}.chi input{flex:1 1 0%;margin-right:8px;padding:9px 14px;border-radius:20px}
/* settings */
#pSet{padding:0}.sw0{display:flex;height:100%}
.smenu{width:236px;background:#0f0f16;border-right:1px solid #22222f;padding:22px 12px;flex:0 0 auto}
.smenu h3{margin:0 10px 16px;font-size:13px;letter-spacing:1.5px;color:#8d8da6}
.mi{display:block;width:100%;text-align:left;background:transparent;color:#bdbdd0;padding:11px 14px;border-radius:9px;font-size:14px;margin-bottom:3px}
.mi:hover{background:#1a1a27}.mi.on{background:#23233a;color:#fff}
.sbody{flex:1 1 0%;overflow-y:auto;padding:30px 40px 50px;-ms-overflow-style:-ms-autohiding-scrollbar}
.sbody h2{margin:0 0 20px;font-size:26px}
.srow{display:flex;align-items:center;background:#181824;border-radius:11px;padding:16px 18px;margin-bottom:10px;max-width:720px}
.srow .sl{flex:1 1 0%;min-width:0;padding-right:16px}.srow .sl b{display:block}.srow .sl span{display:block;color:#9a9ab0;font-size:12.5px;margin-top:3px;line-height:1.5}
.srow input{max-width:320px}.srow .btn{margin-left:8px;white-space:nowrap}
.sw{width:46px;height:25px;border-radius:13px;background:#2f2f42;position:relative;cursor:pointer;transition:background .2s;flex:0 0 auto}
.sw:after{content:"";position:absolute;left:3px;top:3px;width:19px;height:19px;border-radius:10px;background:#fff;transition:left .2s}
.sw.on:after{left:24px}
.swatch{display:inline-block;width:32px;height:32px;border-radius:50%;margin-right:9px;cursor:pointer;border:3px solid transparent}.swatch.on{border-color:#fff}
.acct{display:flex;align-items:center;max-width:720px;margin-bottom:22px}.acct .av{margin-right:20px}
.code{font:700 17px Consolas,monospace;letter-spacing:2px}
/* bottom bar */
#bot{position:absolute;left:0;right:0;bottom:0;height:62px;color:#a3a3b8}
#rec{position:absolute;left:24px;top:13px;height:36px;padding:0 12px;border-radius:9px;background:transparent;color:#a3a3b8;font-size:15px;font-weight:500;max-width:340px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#rec:hover,#rec.on{background:#181822;color:#fff}
#recm{display:none;position:absolute;left:18px;bottom:56px;width:300px;background:#181824;border:1px solid #2b2b3a;border-radius:12px;padding:6px;z-index:30;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#recm.open{display:block;animation:pop .15s both}#recm h5{margin:8px 10px 6px;font-size:11px;letter-spacing:.8px;color:#8d8da6;text-transform:uppercase}
#recm .ri{display:block;width:100%;text-align:left;background:transparent;color:#e3e3ee;padding:9px 10px;border-radius:8px;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#recm .ri:hover{background:#23233a}#recm .em{color:#8d8da6;padding:10px;font-size:13px}
#dlb{position:absolute;left:50%;margin-left:-230px;width:460px;top:21px;cursor:pointer;text-align:center}#dlb:hover #dlt{color:#fff}
#dlt{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:15px;font-weight:500;color:#a3a3b8}
#dlb.act{text-align:left}#dlb.act #dlt{display:inline-block;max-width:190px;font-size:13px;font-weight:600;color:#f3f3f7;vertical-align:bottom}
#dls{float:right;font-size:12px;color:#9a9ab0;padding-top:1px}
#ver{position:absolute;right:176px;top:21px;color:#ff5a5f;font-size:15px;font-weight:500;cursor:pointer}#ver:hover{text-decoration:underline}
#fb{position:absolute;right:20px;top:15px;height:32px;padding:0 14px;border-radius:16px;background:#2c2515;color:#e0a82e;font-weight:600;font-size:13px;border:1px solid #3d331b}#fb:hover{background:#3a3019}
.nv{background:#181824;border-radius:11px;padding:16px 18px;margin-bottom:10px;max-width:720px}.nv h3{margin:0 0 3px;font-size:16px}.nv .nd{color:#9a9ab0;font-size:12.5px;margin-bottom:8px}.nv ul{margin:0;padding-left:20px;line-height:1.7;color:#cfcfdb}
.nv .cur{display:inline-block;background:#3a1d22;color:#ff7a7f;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-left:8px;vertical-align:middle}
#dlbar{height:4px;background:#26263a;border-radius:2px;margin-top:8px;clear:both;overflow:hidden;visibility:hidden}#dlfill{height:4px;width:0}
#dlx{display:none;position:absolute;right:-32px;top:-4px;background:transparent;font-size:16px;padding:3px 9px;color:#9a9ab0}#dlx:hover{color:#fff}
/* downloads page */
.dlh{display:flex;align-items:center;margin-bottom:18px}.dlh h1{margin:0;font-size:26px;flex:1 1 0%}
.dlh button{background:transparent;color:#a3a3b8;width:36px;height:36px;border-radius:18px;font-size:18px;margin-left:6px}.dlh button:hover{background:#1f1f2c;color:#fff}
.dlbox{background:#181824;border-radius:12px;padding:34px 24px;text-align:center;margin-bottom:22px;min-height:150px}
.dlbox .big{font-size:34px;color:#cfcfdb;margin-bottom:8px}.dlbox b{display:block;font-size:16px;margin-bottom:8px}.dlbox span{color:#9a9ab0;display:block;max-width:300px;margin:0 auto;line-height:1.5}
.dlact{text-align:left;padding:22px 26px}.dlact .top{display:flex;align-items:center}.dlact .nm{flex:1 1 0%;font-size:17px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dlact .info{color:#9a9ab0;font-size:13px;margin:10px 0 12px}.dlact .pb{height:6px;background:#26263a;border-radius:3px;overflow:hidden}.dlact .pf{height:6px;background:linear-gradient(90deg,#7bd96a,#7fe3c4)}
.dsec{background:#181824;border-radius:12px;overflow:hidden;margin-bottom:22px}
.dsec h4{margin:0;padding:14px 20px;background:#1f1f2c;font-size:16px}
.dsec .in{padding:16px 20px}.dsec .lb{font-weight:700;margin-bottom:4px}.dsec .vl{color:#cfcfdb;margin-bottom:14px}
.drv{padding:16px 20px;border-top:1px solid #22222f}.drv:first-of-type{border-top:0}
.drv .t{display:flex;align-items:center;margin-bottom:10px}.drv .t b{flex:1 1 0%}.drv .t span{color:#9a9ab0}
.drv .bar2{height:7px;background:#2a2a3a;border-radius:4px;overflow:hidden}.drv .fl{height:7px;background:linear-gradient(90deg,#7bd96a,#7fe3c4)}.drv .fl.hi{background:linear-gradient(90deg,#f5b942,#ef5350)}
.drv.sel{background:#1d1d2c}
.drv .sub{color:#8d8da6;font-size:12.5px;margin-top:8px}
.dloc{display:flex;padding:0 20px 20px}.dloc input{flex:1 1 0%;margin-right:10px}
.sdd{display:none;position:absolute;left:0;top:56px;min-width:210px;background:#1e3550;border:1px solid #2b4767;border-radius:0 0 10px 10px;padding:6px;z-index:25;box-shadow:0 14px 30px rgba(0,0,0,.5)}.sdd.open{display:block}
.sdi{display:block;width:100%;text-align:left;background:transparent;color:#dce8f5;padding:9px 12px;border-radius:7px;font-size:13.5px;white-space:nowrap}.sdi:hover{background:#2c4a6d}
/* xaly arcade store */
#pStore{padding:0;background:radial-gradient(900px 420px at 85% -80px,#2a1f55 0,rgba(18,18,26,0) 70%),#12121a}
.xs{padding:26px 38px 50px}

.cmpe{color:#9aa1b8;font-size:13.5px;margin-bottom:10px}
.cmpt{display:flex;flex-wrap:wrap;margin-bottom:12px}.cmpt button{background:#141925;color:#9aa1b8;border-radius:999px;padding:6px 12px;margin:0 6px 6px 0;font-weight:700;font-size:12.5px}.cmpt button.on{background:#0f3540;color:#fff}
.cmph{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.cmps{flex:1 1 200px;display:flex;align-items:center;background:#10141d;border:1px solid #1f2636;border-radius:12px;padding:10px 12px;min-width:0}
.cmps.lead{border-color:#2ee6f0}.cmpv{margin-left:10px;min-width:0}.cmpv b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cmpv span{display:block;color:#9aa1b8;font-size:12.5px}
.cmpvs{margin:6px 12px;color:#5d6480;font-weight:800;font-size:12px}
.cmpl{margin-bottom:12px}
.cmpr{display:flex;align-items:center;padding:7px 0;border-bottom:1px solid #1a2030;font-size:13.5px}.cmpr:last-child{border-bottom:0}
.cmpr>span{flex:1 1 0%;margin-left:10px;color:#d6dae6}.cmpr.them>span{color:#ffb4a0}.cmpr.you>span{color:#9ff0c4}
.achi.sm{width:28px;height:28px;min-width:28px;line-height:1;font-size:14px;border-radius:8px;flex:0 0 auto;background:#2a3042;display:flex;align-items:center;justify-content:center;padding:0;margin:0}
.cmpa{display:flex;justify-content:space-between;margin-bottom:8px}
.cmpm{margin:6px 0 10px}.cmpc{display:flex;align-items:center;padding:5px 0;font-size:13px}.cmpc>span{flex:1 1 0%;margin-left:10px}.cmpc i{font-style:normal;width:64px;text-align:center;font-weight:700}.cmpc i.y{color:#3ddc84}.cmpc i.n{color:#4b5168}
.cmphd{color:#7d8299;font-size:11.5px;text-transform:uppercase;letter-spacing:.06em}.cmphd>span:first-child{width:28px;flex:0 0 28px;margin:0}
.cmpn{color:#5d6480;font-size:11.5px;margin-top:4px}
.cmpch{margin-top:12px;border-top:1px solid #1f2636;padding-top:10px}.cmpch>b{display:block;font-size:13px;margin-bottom:6px}
.chtop{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 10px}.chtop span{color:#9aa1b8;font-size:12.5px}
.fsec{color:#7d8299;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;margin:12px 6px 4px}
.chr{display:flex;align-items:center;padding:9px 6px;border-radius:10px}.chr:hover{background:#151a26}
.chm{flex:1 1 0%;min-width:0;margin:0 8px 0 10px}.chm small{display:block;color:#7d8299;font-size:11px}.chm b{display:block;font-size:13px;line-height:1.35}.chm span{display:block;color:#9aa1b8;font-size:11.5px;margin-top:2px}
.chr.done .chm span{color:#3ddc84}.chr.expired,.chr.declined,.chr.failed{opacity:.6}
.chr .sm{margin-left:4px;flex:0 0 auto}

.dqk{display:flex;align-items:center;flex-wrap:wrap;margin-bottom:12px}.dqk>span{color:#9aa1b8;font-size:13px;margin-right:10px}.dqk>span:nth-of-type(2){margin-left:18px}
.ssel{width:auto!important;min-width:130px;max-width:220px;flex:0 0 auto;background:#141925;color:#e8ebf5;border:1px solid #262d40;border-radius:8px;padding:6px 10px;font-size:13px}
.iact{display:flex!important;flex-direction:row!important;align-items:center;justify-content:flex-end;width:auto!important;flex:0 0 auto!important;min-width:70px}.iact .btn.sm{margin-right:12px;white-space:nowrap}

.fgw{margin:4px 0 16px}.fgs{color:#9aa1b8;font-size:13.5px;line-height:1.5;margin-bottom:10px}
.fgspin{width:28px;height:28px;border-radius:50%;border:3px solid #263044;border-top-color:#2ee6f0;margin:14px auto;animation:fgsp .8s linear infinite}@keyframes fgsp{to{transform:rotate(360deg)}}
.fgl{max-height:340px;overflow-y:auto;margin:0 -6px 14px;padding:0 6px}
#mbox label.fgr,.fgr{display:flex!important;flex-direction:row;align-items:center;padding:8px 6px;margin:0;border-radius:8px;cursor:pointer;text-transform:none;letter-spacing:0;font-weight:400;color:#e8ebf5}.fgr:hover{background:#151a26}.fgr.have{opacity:.5;cursor:default}
#mbox .fgr input{width:18px!important;height:18px;min-width:18px;margin:0 12px 0 0;padding:0;flex:0 0 auto;display:inline-block;accent-color:#2ee6f0}
.fgt{min-width:0}.fgt b{display:block;font-size:13.5px}.fgt span{display:block;color:#7d8299;font-size:11.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:440px}
.lemail+.lemail{margin-left:10px}
</style>

 {v:"1.6.7",d:"5 Nov 2026",t:["Find games on your PC: Library \u203A Find games on PC adds your Steam, Epic Games, GOG and itch.io app games, plus any folder you pick, in one go","Account backup: save your library, play time, achievements and friends to a password-protected file and restore it on another PC (Settings \u203A Account, or the sign-in screen)","Desktop and Start menu shortcuts for any game, from its \u22EF menu. They start the game through Xaly, so play time still counts","Xaly Launcher now shows up in Windows Settings \u203A Apps with a proper uninstaller, and in the Start menu"]},
 {v:"1.6.6",d:"5 Nov 2026",t:["Fixed: the launcher froze over and over while the Store was filling in games, covers and screenshots. Covers now update in place, and the Store page is rebuilt far less often and faster"]},
 {v:"1.6.5",d:"5 Nov 2026",t:["Download speed limit: cap how fast games download, in Settings \u203A Downloads or right on the Downloads page","Download schedule: only download at set hours, like overnight. Xaly keeps the PC awake while downloads wait or run, and you can still start one right away","Settings \u203A Storage now lists games on every drive, including ones you moved, and each game has a Move button"]},
 {v:"1.6.4",d:"5 Nov 2026",t:["Messages now have their own pop-up and chime, also while you\u2019re in a game. Click the pop-up to open the chat","Turn them off in Settings \u203A General"]},
 {v:"1.6.3",d:"5 Nov 2026",t:["Compare with friends: a game\u2019s page shows your play time and achievements next to a friend\u2019s, like \u201cBob beat Night Shift, you haven\u2019t yet\u201d","Friend challenges: send \u201cGet Marathon in Sonic Time Twisted by Sunday\u201d or your own goal like \u201cBeat night 5\u201d. Achievement goals complete by themselves, and you both get a notification","A pop-up and a sound when a friend comes online or starts playing a game, also while you\u2019re in a game","Achievement pop-ups now also show on top of games"]},
 {v:"1.6.2",d:"5 Nov 2026",t:["Every launcher now switches to a new Store list at the same moment, so two PCs never show a different number of games, not even right after the list is refreshed"]},
 {v:"1.6.1",d:"5 Nov 2026",t:["Fixed: the shared Store list only loaded once your old list was 6 hours old, so two PCs could still show different games. It now loads straight away and refreshes every 2 hours","Games found through the search box only show up while you search, so they no longer change the number of games in the Store"]},
 {v:"1.6.0",d:"5 Nov 2026",t:["Everyone now sees the same Store: one shared list of thousands of free itch.io games, refreshed every 6 hours, instead of each PC building its own","Games in your library or wishlist always stay in your Store"]},
 {v:"1.5.11",d:"5 Nov 2026",t:["When Google Drive or MediaFire won\u2019t give a game to Xaly (for example Drive\u2019s download limit), press Download in browser: your browser gets the file and Xaly installs it as soon as it lands in your Downloads folder","You can also pick a game file you already downloaded","Fixed: Drive\u2019s download limit was sometimes reported when Google said something else. Xaly now shows Google\u2019s own message"]},
 {v:"1.5.10",d:"5 Nov 2026",t:["Fixed: downloads showed \u201cConnection lost\u201d for every kind of problem. They now say what actually went wrong, like Google Drive\u2019s daily download limit","Problems that won\u2019t fix themselves (a removed file, a download limit, a private link) no longer retry over and over: the download stops with a Retry button"]},
 {v:"1.5.9",d:"5 Nov 2026",t:["itch.io games whose download is a Google Drive or MediaFire link now install straight from Xaly, and show up in the Store like any other game","Xaly also finds Google Drive and MediaFire links in a game\u2019s description when there\u2019s no download button","MediaFire downloads are now supported, also in Add game and the paste-a-link box"]},
 {v:"1.5.8",d:"5 Nov 2026",t:["Fixed: Super Smash Bros. Crusade couldn\u2019t be installed when you found it through search. Every copy now uses the working Google Drive download"]},
 {v:"1.5.7",d:"5 Nov 2026",t:["New in the Store: Super Smash Bros. Crusade, the fan-made Smash with a huge roster","Games hosted on Google Drive now download properly, including big files that show Google\u2019s virus-scan warning","Games packed as .7z or .rar can now be installed, not just .zip","If a link opens a web page instead of a game, the download now stops with a clear message instead of failing at install"]},
 {v:"1.5.6",d:"5 Nov 2026",t:["Fixed: the old Windows scrollbars showed up in the library, menus and pop-ups. Every list now uses the slim Xaly scrollbar","Fixed: the ticked option in the View and Sort menus was squashed and cut off","Fixed: games that are a single .exe couldn\u2019t be uninstalled or moved. They now get their own folder, including ones you already have","Fixed: updating a game after moving it to another drive"]},
 {v:"1.5.5",d:"5 Nov 2026",t:["Move games to another drive: open a game and press Move. Play time, achievements and updates stay with it","Messages now arrive within a second through a live connection, instead of waiting for the next check","Fixed: your message stayed in the box after you sent it","Friend activity: see what friends played, installed and unlocked, with Get it and Play buttons, in the Friends panel and on the Store page","Game pages show the download size and your free space, and Xaly warns you before installing if the drive is too full"]},
 {v:"1.5.4",d:"5 Nov 2026",t:["New sounds: a chime when a game finishes downloading or updating, and a fanfare when you unlock an achievement. You hear them even while you\u2019re in a game","Turn sounds off or listen to them in Settings \u203A General"]},
 {v:"1.5.3",d:"5 Nov 2026",t:["New achievements for every game: First Launch, Night Shift, Marathon, Week Streak, Legend and more. Unlocking one pops up a little trophy","Each game\u2019s page shows its achievements with progress bars, and your profile shows your latest ones to friends. Achievements also give XP","Crash reports: if something goes wrong, the details are sent to the developer automatically so it can be fixed. You can turn this off in Settings \u203A About"]},
 {v:"1.5.2",d:"5 Nov 2026",t:["Download queue: install as many games as you like and they download one after another. Pause, resume, reorder or cancel them on the Downloads page","Downloads now continue where they stopped if your internet drops, and after you restart Xaly","Xaly now installs updates by itself when it starts, with a progress screen that shows your download speed","A What\u2019s new popup shows the changes after each update. Tick Don\u2019t show again to turn it off"]},
 {v:"1.5.1",d:"5 Nov 2026",t:["TV mode: a full-screen, controller-friendly view for playing on a TV. Open it from the sidebar or press Start on a controller","Game updates: Xaly remembers which build of each game you installed and shows an Update badge when the developer uploads a new one. Updating keeps your saves","Settings \u203A General has switches for game updates and TV mode"]},
 {v:"1.5.0",d:"5 Nov 2026",t:["New display engine: Xaly now runs on Microsoft Edge WebView2 instead of Internet Explorer, so pages, scrolling and animations are faster and smoother","If WebView2 isn\u2019t available the launcher falls back to the old engine by itself; you can switch in Settings \u203A General","Fixed feedback messages with more than one line failing to send"]},
 {v:"1.4.1",d:"5 Nov 2026",t:["itch.io installs work out of the box again with a new built-in key","First update delivered through the new self-updater"]},
 {v:"1.4.0",d:"5 Nov 2026",t:["Xaly now updates itself: new versions are published on GitHub, and the launcher offers to install them with one click","Check for updates in Settings \u203A About","Installs from itch.io use a new built-in key"]},
 {v:"1.3.0",d:"5 Nov 2026",t:["New profiles: your picture, level and XP, badges you earn by playing, a favourite-game showcase, recent activity with hours played in the past 2 weeks, and stats","Edit profile: real name, country, About me, favourite game, background and featured badge","Friends can see each other\u2019s profiles and pictures (shared privately, end-to-end encrypted). Open one from a chat or from your profile\u2019s friends list"]},
 {v:"1.2.0",d:"5 Nov 2026",t:["The store now grows to thousands of free games: it reads itch.io\u2019s game feeds and keeps paging deeper in the background","Give feedback no longer freezes the launcher and explains what to do if sending fails, with a Send with my email app option","Recently played menu now shows above the page","Messages look like iMessage: blue bubbles on the right, grey on the left, with Delivered and Read receipts","Create accounts with your Gmail address and a password, and sign in with them"]},
 {v:"1.1.0",d:"5 Nov 2026",t:["The store now pulls free Windows games from itch.io by itself and updates every 6 hours: popular, new, top rated, horror, platformers, action, RPG and more","Genre buttons under the series filters, \u201CLoad more from itch.io\u201D at the bottom of every list, and search now looks through all of itch.io","Friends panel now sits beside the page instead of covering it","New slim scrollbars and nicer drop-downs","Settings \u203A General: switch between the new Sidebar layout and the Classic layout"]},
 {v:"1.0.0",d:"5 Nov 2026",t:["Notifications: when a game finishes downloading you get a card with a Play now button, plus a Windows notification if the launcher is in the background","New bell in the sidebar keeps a list of your recent notifications","Redesigned layout: a sidebar with Store, Library, Downloads, Friends and Settings, a live download card, and your account at the bottom","Two new switches in Settings \u203A General to turn the notifications off"]},
 {v:"0.9.0",d:"5 Nov 2026",t:["In-game overlay: press Shift+Tab while playing to see play time, take screenshots and chat with friends","Over 60 new free games, including 40 more Five Nights at Freddy\u2019s fan games and lots of free indie games","Every game in the store now has artwork. Games without a picture, and paid games, are hidden","Player reviews: star ratings and comments from each game\u2019s itch.io page","New store layout with a featured carousel, scrolling shelves and a Top rated row","Logo is now cyan, with a matching cyan accent colour"]},
 {v:"0.8.0",d:"5 Nov 2026",t:["New online friend system: send friend requests by code, accept or decline them, and cancel ones you sent","See which friends are online, away or busy, what they are playing, and when they were last online. No shared folder needed any more","Chat with friends right in the Friends panel. Messages and status are end-to-end encrypted","Recommend a game from its store page; your friend gets a card with a View in store button","Give feedback now emails the developer"]},
 {v:"0.7.0",d:"5 Nov 2026",t:["Redesigned store game page: big screenshot gallery with thumbnails, a buy box with price, wishlist and install, and a details panel","System requirements (minimum and recommended) on every game. Where a developer doesn\u2019t publish them they are estimated from the type of game, and the page says so","The downloaded .zip is now deleted automatically once the game is unpacked","Uninstall button for games installed by the launcher, on both the store page and the library page; it deletes the game\u2019s files and removes it from your library"]},
 {v:"0.6.0",d:"5 Nov 2026",t:["New list view in the Library, like the Epic Games launcher: your games on the left, details on the right with size on disk, version, developer and play time. Switch views from the button next to search","Library tabs (Games / Favorites) and a Filter and sort menu","Sign out and switch accounts: click your name at the top. Each account has its own library, friends and settings, with an optional password","Fixed the itch.io \u201Crefused the request\u201D error: installs now use itch.io\u2019s current API with a fallback to the old one. Settings > Downloads can test your API key","Installs from GitHub releases for PC recomps and open-source ports (always the newest build)","New Recomp shelf plus many more fan games and indie games with direct Windows downloads","Games with no Windows download (.exe, .zip or .msi) are hidden from the store automatically"]},
 {v:"0.5.0",d:"5 Nov 2026",t:["Xaly is now a pure itch.io launcher: Steam and GameJolt games are gone","New store design: a poster wall sorted by series (Mario, Sonic, FNAF, Pok\u00e9mon, Indie) with a daily Today's Pick and a Surprise me button","24 free itch.io games with direct, one-click downloads, including Mario, Sonic and FNAF fan games","Fixed the bug where Install had to be pressed twice","Install from itch.io asks itch.io for the newest Windows build, downloads it, unpacks it and adds it to your library"]},
 {v:"0.4.0",d:"5 Nov 2026",t:["New Storage tab in Settings: pick any drive, see used and free space with an animated ring, and a colour-coded breakdown (games, downloads, cache, app data, other)","Star a drive to make it the default install drive","Installed games listed with cover art, size and last played; sort by size, name or last played","Select games and delete them from your PC to free up space","Low-space warning when a drive is nearly full; sizes are measured in the background"]},
 {v:"0.3.0",d:"5 Nov 2026",t:["Store redesigned in a Steam-style layout: category bar, search, wishlist, big featured banner with a side panel and screenshots","21 free-to-play Steam games added (Counter-Strike 2, Dota 2, PUBG, Apex Legends, Warframe, Marvel Rivals and more) with cover art and screenshots loaded live from Steam","Screenshots are now also pulled from itch.io game pages","Wishlist (star on any game), category and Ways to Play filters, See More on each shelf","Steam games install through the Steam app and are added to your library","Internet connections now use modern TLS so Steam and itch.io load reliably"]},
 {v:"0.2.0",d:"5 Nov 2026",t:["New Downloads page: current download, live speed, every drive on your PC with free space, and a Change button for the install folder","Bottom bar redesigned: Recent menu, Downloads, version label and Give feedback","The version number is now shown in the bottom bar (click it to see patch notes)","New Cache tab in Settings: see how much is cached, clear it, and restart the app","Patch notes added to Settings > About","Chosen download folder is remembered between launches"]},
 {v:"0.1.0",d:"Initial preview",t:["Store with featured carousel and per-game pages, with one-click install for .exe, .zip and installer downloads","Library with play-time tracking, favourites, add/remove games and game icons","Friends list with online status, using a shared sync folder","Runs in the tray, optional start with Windows, accent colours and opening animation","Imports games from the old Launchpad automatically"]}

/* ---------- friends: online, end-to-end encrypted, over the free ntfy.sh relay ---------- */
var frPollT=0,frBusy=0,frErr="",FR_HB=480000,FR_ON=1080000,chatL=null,chatI=null;
function frOn(){return !!(S&&S.set.online!==0&&S.fr&&S.fr.pub);}
function frInit(){
  if(!S||S.set.online===0)return;
  if(S.fr&&S.fr.pub)return;

  var pp=r.split("|"),code=T(function(){return X.PubCode(pp[1]);},"");
  if(!/^\d{9}$/.test(code)){frErr="Couldn't set up online friends on this PC.";return;}
  if(S.friends&&S.friends.length)S.oldFriends=S.friends;
  S.friends=[];
  S.fr={priv:pp[0],pub:pp[1],sk:T(function(){return X.RandHex("32");},""),since:0,seen:{},out:[],inc:[],last:"",lastT:0};
  S.fr.stopic=frStTopic(S.fr.sk);
  S.user.code=code;save();
}
function frTopicReq(code){return "xaly-fr-"+code;}
function frPairTopic(f){if(!f.topic)f.topic="xaly-p-"+T(function(){return X.Topic(f.key,"pair");},"");return f.topic;}
function frStTopic(sk){return "xaly-s-"+T(function(){return X.Topic(sk,"status");},"");}
function relay(topics,since,body,cb){
  var s0=S,id="r"+now()+Math.floor(Math.random()*99999),r=T(function(){return X.Relay(id,topics,since||"",body||"");});
  if(r.indexOf("ERR")===0){if(cb)cb(false,r,0);return;}

}
function seal(key,o){var r=T(function(){return X.Seal(key,JSON.stringify(o));});return r.indexOf("ERR")===0?"":r;}
function unseal(key,s){var r=T(function(){return X.Unseal(key,s);});if(r.indexOf("ERR")===0)return null;try{return JSON.parse(r);}catch(e){return null;}}
function meCard(t){return JSON.stringify({xaly:1,t:t,code:S.user.code,name:S.user.name,color:S.user.color,pub:S.fr.pub});}
function findF(c){var i;for(i=0;i<S.friends.length;i++)if(S.friends[i].code===c)return S.friends[i];return null;}
function findIn(list,c){var i;for(i=0;i<list.length;i++)if(list[i].code===c)return i;return -1;}
function frNet(st){frErr=st===429?"The friend relay is busy. Trying again shortly.":"Can't reach the friend service. Check your internet connection.";}
function cleanName(n){return String(n||"").substr(0,40);}
function cleanCol(c){return Math.abs(parseInt(c,10)||0)%AV.length;}
var STT={online:"Online",away:"Away",busy:"Do not disturb",invisible:"Invisible",offline:"Offline"};
function pstate(f){if(!frOn()||!f.seen||now()-f.seen>FR_ON||f.status==="offline"||f.status==="invisible")return "offline";return f.status||"online";}
function fname2(f){return f.nick||f.name||("Friend "+f.code.substr(0,3));}
function ago(t){var m=Math.round((now()-t)/60000);if(m<2)return "just now";if(m<60)return m+" min ago";var h=Math.round(m/60);if(h<24)return h+(h===1?" hour ago":" hours ago");var d=Math.round(h/24);return d+(d===1?" day ago":" days ago");}

function frSend(f,o,cb){

/* requests */
function addFriend(code,nick){
  if(!frOn()){toast("Turn on online friends in Settings › Friends first");return false;}
  code=(code||"").replace(/\D/g,"");
  if(code.length!==9){toast("A friend code has 9 digits");return false;}
  if(code===S.user.code){toast("That's your own code");return false;}
  if(findF(code)){toast("They're already your friend");return false;}
  var ii=findIn(S.fr.inc,code);if(ii>=0){acceptReq(S.fr.inc[ii]);return;}
  relay(frTopicReq(code),"",meCard("req"),function(ok,t,st){
    if(!ok){frNet(st);toast("Couldn't send the request. Check your connection and try again.");return;}
    if(findIn(S.fr.out,code)<0)S.fr.out.push({code:code,nick:nick||"",ts:now()});
    save();renderFriends();toast("Friend request sent");
  });
}
function acceptReq(q){
  relay(frTopicReq(q.code),"",meCard("acc"),function(ok,t,st){
    if(!ok){frNet(st);toast("Couldn't accept right now. Try again in a moment.");return;}
    var i=findIn(S.fr.inc,q.code);if(i>=0)S.fr.inc.splice(i,1);

    save();renderFriends();

  var key=T(function(){return X.EcShared(S.fr.priv,q.pub);});
  if(key.indexOf("ERR")===0||key.length!==64){toast("Couldn't set up a secure connection with "+q.name);return null;}

function pubStatus(force){
  if(!frOn()||!S.fr.sk||!S.friends.length)return;
  var o=myStatus();
  if(o.p&&JSON.stringify(o).length>2600){o.p.rec=(o.p.rec||[]).map(function(r){return r?{n:r.n,h:r.h,l:r.l,sid:r.sid,i:""}:r;});if(o.p.fav)o.p.fav.i="";}
  if(o.p&&JSON.stringify(o).length>2600)o.p.ev=(o.p.ev||[]).slice(0,3);
  var sig=JSON.stringify(o);
  if(!force&&sig===S.fr.last&&(o.status==="offline"||now()-S.fr.lastT<FR_HB))return;
  var s=seal(S.fr.sk,o);if(!s)return;
  S.fr.last=sig;S.fr.lastT=now();
  if(!S.fr.stopic)S.fr.stopic=frStTopic(S.fr.sk);
  relay(S.fr.stopic,"",s,function(ok,t,st){if(!ok){frNet(st);S.fr.lastT=0;S.fr.last="";}});
  var avs=S.prof&&S.prof.avs||"";

}

var frLive=0,frStreamSig="";
function frTopics(){var tp=[frTopicReq(S.user.code)];S.friends.forEach(function(f){tp.push(frPairTopic(f));if(f.sk){if(!f.stopic)f.stopic=frStTopic(f.sk);tp.push(f.stopic);}});return tp.slice(0,150);}
function frStream(){

  var sig=frTopics().join(",");if(sig===frStreamSig)return;

var frLiveT=null;
